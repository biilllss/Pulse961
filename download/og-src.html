<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0A0A0A; }
  .card { position: relative; width: 1200px; height: 630px; }
  .bg { position: absolute; inset: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.72) saturate(0.9); }
  /* readability scrim, heavier on the left */
  .scrim { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.55) 42%, rgba(10,10,10,0.12) 75%),
    linear-gradient(0deg, rgba(10,10,10,0.85) 0%, rgba(10,10,10,0) 32%);
  }
  .content { position: absolute; inset: 0; padding: 52px 56px 100px; display: flex; flex-direction: column; }
  .wordmark { font-family: 'Bebas Neue', sans-serif; font-size: 44px; letter-spacing: 0.04em; color: #fff; line-height: 1; }
  .wordmark em { font-style: normal; color: #C6FF3D; }
  .headline { margin-top: auto; font-family: 'Bebas Neue', sans-serif; font-size: 128px; line-height: 0.88; color: #fff; letter-spacing: 0.01em; max-width: 780px; }
  .headline .volt { color: #C6FF3D; }
  .sub { margin-top: 22px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 22px; color: rgba(255,255,255,0.85); }
  .sub b { color: #C6FF3D; font-weight: 800; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #C6FF3D; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
  .strip .l { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.12em; color: #0A0A0A; }
  .strip .r { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 24px; color: #0A0A0A; }
  .tick { position: absolute; top: 52px; right: 56px; width: 64px; height: 64px; border-top: 4px solid #C6FF3D; border-inline-end: 4px solid #C6FF3D; opacity: .9; }
</style>
</head>
<body>
  <div class="card">
    <div class="bg"><img src="file:///home/z/my-project/public/og-bg.png" alt=""></div>
    <div class="scrim"></div>
    <div class="content">
      <div class="wordmark">PULSE<em>961</em></div>
      <div class="tick"></div>
      <h1 class="headline">STRONGER THAN<br><span class="volt">YOUR EXCUSES.</span></h1>
      <p class="sub">Strength &middot; Boxing &middot; HIIT &mdash; <b>first week free</b></p>
    </div>
    <div class="strip">
      <span class="l">MAR MIKHAEL, BEIRUT &mdash; 24/7</span>
      <span class="r" dir="rtl">جيم بوتيك في بيروت &mdash; بلس ٩٦١</span>
    </div>
  </div>
</body>
</html>
